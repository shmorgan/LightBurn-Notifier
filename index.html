<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LightBurn Status</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1d2330; --muted:#6b7385; --ok:#1a8f4c; --bad:#c9342b; --warn:#b7791f; --line:#e3e6ec; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171e; --card:#1d222c; --fg:#e8ebf2; --muted:#9097a8; --ok:#3ccf7e; --bad:#ff6b61; --warn:#e8b04a; --line:#2c3340; }
  }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:32px 16px; }
  h1 { font-size:1.4rem; margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
  .state { display:flex; align-items:center; gap:10px; font-size:1.2rem; font-weight:600; }
  .dot { width:14px; height:14px; border-radius:50%; background:var(--muted); }
  .ok .dot { background:var(--ok); } .bad .dot { background:var(--bad); } .warn .dot { background:var(--warn); }
  dl { display:grid; grid-template-columns:auto 1fr; gap:6px 16px; margin:16px 0 0; }
  dt { color:var(--muted); } dd { margin:0; }
  .bar { height:10px; background:var(--line); border-radius:5px; overflow:hidden; margin-bottom:4px; }
  #fill { height:100%; width:0; background:var(--ok); transition:width .4s; }
  .err { color:var(--bad); margin-top:12px; }
  footer { color:var(--muted); font-size:.85rem; margin-top:12px; }
</style>
</head>
<body>
<main>
  <div style="display:flex; justify-content:space-between; align-items:baseline; gap:12px">
    <h1>LightBurn Status</h1>
    <a href="config" style="color:var(--ok); font-weight:600; text-decoration:none; white-space:nowrap">⚙ Alert settings</a>
  </div>
  <div class="card">
    <div id="state" class="state"><span class="dot"></span><span id="headline">Checking…</span></div>
    <div id="err" class="err" hidden></div>
    <dl>
      <dt>Program</dt><dd id="prog">–</dd>
      <dt>Machine</dt><dd id="dev">–</dd>
      <dt>Machine connected</dt><dd id="conn">–</dd>
      <dt>Job</dt><dd id="job">–</dd>
      <dt>Progress</dt><dd><div class="bar"><div id="fill"></div></div><span id="pct">–</span></dd>
      <dt>Machine position</dt><dd id="mpos">–</dd>
      <dt>Workpiece position</dt><dd id="wpos">–</dd>
      <dt>Z axis / overrides</dt><dd id="caps">–</dd>
    </dl>
  </div>
  <footer>Last checked: <span id="when">never</span> · refreshes every 5 s · 10.255.201.243:19520 · <a href="config" style="color:inherit">Alert settings</a></footer>
</main>
<script>
const $ = id => document.getElementById(id);
const yn = v => v ? 'Yes' : 'No';
const fmt = p => !p ? '–' : ['x','y','z'].filter(a => p[a] != null).map(a => a.toUpperCase() + ' ' + p[a].toFixed(2)).join('   ') + ' mm';
function set(cls, headline) { $('state').className = 'state ' + cls; $('headline').textContent = headline; }

async function refresh() {
  try {
    const [s, p] = await Promise.all([
      fetch('api/status', {cache:'no-store'}),
      fetch('api/poll', {cache:'no-store'}),
    ]);
    const st = await s.json();
    if (!s.ok) throw new Error(st.error || ('HTTP ' + s.status));
    $('err').hidden = true;
    set('ok', 'LightBurn is running');
    $('prog').textContent = 'Running, API reachable';
    $('dev').textContent = st.device_name || '–';
    $('conn').textContent = yn(st.connected);
    $('caps').textContent = yn(st.supports_z) + ' / ' + yn(st.supports_overrides);
    if (p.ok) {
      const d = await p.json(), j = d.job || {};
      $('job').textContent = j.state || 'unknown';
      const pr = j.progress;
      $('fill').style.width = (pr != null ? Math.min(100, Math.max(0, pr)) : 0) + '%';
      $('pct').textContent = pr != null ? pr.toFixed(1) + '%' : (j.state === 'idle' ? 'No job running' : 'Not reported');
      $('mpos').textContent = fmt(d.position && d.position.machine);
      $('wpos').textContent = fmt(d.position && d.position.workpiece);
    } else {
      for (const id of ['job','pct','mpos','wpos']) $(id).textContent = '–';
      $('fill').style.width = '0';
    }
    $('when').textContent = new Date().toLocaleTimeString();
  } catch (e) {
    set('bad', 'LightBurn not reachable');
    $('prog').textContent = 'Not responding';
    $('err').textContent = e.message; $('err').hidden = false;
    $('when').textContent = new Date().toLocaleTimeString();
  }
}
refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
